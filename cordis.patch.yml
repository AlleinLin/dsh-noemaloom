# Mount the Mnemon bridge into a DSH profile. A profile's final patch may
# replace this config row as a whole; use user settings or environment
# variables for one-field overrides such as cliPath.
- insert:
    # Keep the v0.4 `mnemon` Entry as the public configuration target while
    # making every v0.5 component inherit its enabled state. The expression
    # reads the core row's own flag (rather than its effective state) to avoid
    # recursing through this ancestor gate. The group itself prepares the
    # Starter's dependency resolution before it imports its children.
    - id: mnemon-bundle
      name: 'dsh-noemaloom/original/mnemon-bundle'
      group: true
      disabled: !!js >-
        ((entry) => entry.options.disabled?.__jsExpr
          ? Boolean(entry.evaluate(entry.options.disabled.__jsExpr))
          : Boolean(entry.options.disabled))
        ([...loader.entries()].find(entry => entry.options.id === 'mnemon'))
      config:
        - id: mnemon
          # Core/Host and default settings. Sources own their independent Entries.
          name: 'dsh-noemaloom/original/mnemon'
          config:
            routingGuidance: true
            lifecycleEnabled: true
            recallMode: guided
            writebackMode: guided
            idleReviewMs: 30000
            tabEnabled: true
            writeEnabled: true
            remoteAccess: read-only
            timeoutMs: 10000
            defaultRecallLimit: 10
            embedding:
              enabled: false
              endpoint: http://localhost:11434
              model: nomic-embed-text
            recallQuality:
              policy: strict-v1
              lowScoreThreshold: 0.25
              highScoreThreshold: 0.6
              candidateMultiplier: 3
              maxMediumResults: 4
              maxUnknownResults: 2
        - id: mnemon-source-runtime
          name: 'dsh-noemaloom/original/mnemon-source-runtime'
        - id: mnemon-source-documents
          name: 'dsh-noemaloom/original/mnemon-source-documents'
        - id: mnemon-source-memory-spaces
          name: 'dsh-noemaloom/original/mnemon-source-memory-spaces'
          config:
            # Every default Provider is an
            # explicit child. A custom parent composition may choose a subset.
            providers:
              - use: 'dsh-noemaloom/original/mnemon-provider-mnemon-native'
                instanceId: mnemon-native
              - use: 'dsh-noemaloom/original/mnemon-provider-openviking'
                instanceId: openviking
              - use: 'dsh-noemaloom/original/mnemon-provider-honcho'
                instanceId: honcho
              - use: 'dsh-noemaloom/original/mnemon-provider-mem0'
                instanceId: mem0
              - use: 'dsh-noemaloom/original/mnemon-provider-hindsight'
                instanceId: hindsight
              - use: 'dsh-noemaloom/original/mnemon-provider-holographic'
                instanceId: holographic
              - use: 'dsh-noemaloom/original/mnemon-provider-retaindb'
                instanceId: retaindb
              - use: 'dsh-noemaloom/original/mnemon-provider-byterover'
                instanceId: byterover
              - use: 'dsh-noemaloom/original/mnemon-provider-supermemory'
                instanceId: supermemory
        # Skills keep DSH's own files and their evolution data; the page lives
        # in the Memory System and nothing joins a model View.
        - id: mnemon-source-skills
          name: 'dsh-noemaloom/original/mnemon-source-skills'
        - id: mnemon-strategy-default-three-tier
          name: 'dsh-noemaloom/original/mnemon-strategy-default-three-tier'
        # A second main Strategy; memoryView.strategyTypeId selects which one
        # composes the View. It stays off until selected.
        - id: mnemon-strategy-general
          name: 'dsh-noemaloom/original/mnemon-strategy-general'
          disabled: true
        # v0.5 ships these narrowly scoped enhancements with the Starter so the
        # Settings switches are always available. They remain opt-in.
        - id: mnemon-strategy-auto-capture
          name: 'dsh-noemaloom/original/mnemon-strategy-auto-capture'
          disabled: true
        - id: mnemon-strategy-light-context
          name: 'dsh-noemaloom/original/mnemon-strategy-light-context'
          disabled: true
        - id: mnemon-strategy-scoped
          name: 'dsh-noemaloom/original/mnemon-strategy-scoped'
          disabled: true

# Seven stable component IDs. Saved profile row overrides take precedence.
# The shell row is enabled on every supported platform; the Loader keeps the
# platform-defaults expression only for the rows that still need one.
# File, PTC and discovery start enabled. Panel, TUI and official replacements are opt-in.
# Keep the legacy file specifier so name-qualified saved overrides still match.
# The removed background row remains a no-op compatibility export.
- insert:
    - id: dsh-ops-shell
      name: dsh-ops/shell
      config:
        promptPolicy: true
        publishBashTool: true
        shellPolicy: advise
        allowSystemShellFallback: false
    - id: dsh-ops-file
      name: dsh-ops/file
      config:
        promptPolicy: true
        required: false
    - id: dsh-ops-ptc
      name: dsh-ops/ptc
      config:
        required: false
        alwaysLoaded: [grep, glob]
    - id: dsh-ops-discovery
      name: dsh-ops/discovery
      config:
        enabled: true
        maxResults: 3
        alwaysLoaded: [grep, glob]
        required: false
        denyCredentialReads: true
    - id: dsh-ops-panel
      name: dsh-ops/panel
      disabled: true
      config:
        # Row enablement starts capture; explicit legacy capture:false stays inert.
        capture: true
        textLimit: 2000
        maxSessionBytes: 8388608
    - id: dsh-ops-tui
      name: dsh-ops/tui
      disabled: true
      config:
        maxSessions: 32
        maxActive: 128
        recentLimit: 8
    - id: dsh-ops-hide-official
      name: dsh-ops/hide-official
      disabled: true
      config:
        replaceTools: []

# dshell bundle patch — applied on top of the dsh `web` profile.
#
# Normally applied by the PROFILE: the bundle is installed into one
# (`dsh plugin --profile <name> add -w @nexus-aethra/dshell-bundle@<version>`,
# see the README) and the loader reads this file from it. A checkout run may
# also pass it directly — `dsh --patch <this file> web` — with the flag BEFORE
# the app name, since anything after `web` is forwarded to the app itself.
#
# Each dshell-* package below is a Cordis row the bundle brings into the
# active composition. The patch ADDS rows; it disables exactly two stock ones,
# both for a stated single-provider reason, and leaves every other stock row —
# the conversation view, the workspace sidebar, the header jobs dropdown —
# running. dshell's own surfaces are per-session: a session opts into the
# integrated terminal at creation (the blank-session switch), and every dshell
# client registration exists only while the current session carries that flag,
# so a stock session sees none of it.

# ── host half: terminal capability ─────────────────────────────────────
# dsh ships the `web` profile with bash + sandbox already configured, so
# dshell reuses the existing sandbox row and inserts one dsh row besides its
# own packages: the PTY service, which the stock web surface does not mount in
# the host plane (see below). Each row uses a fresh id so it cannot collide
# with a shipped tooling id.

- insert:
    # The one dsh package dshell must name: `ctx.terminals`, the PTY service and
    # backend registry. dshell's bridge registers its backend into it and reads
    # its types, and dsh's own web surface does NOT mount it in the host plane
    # (only inside the minimal preset's isolated `terminals` realm), so the row
    # that provides it is ours to add. The id is fresh so it cannot collide with
    # a shipped one.
    - id: dshell-terminal
      name: '@deepseek-ai/dsh-terminal'

    # NOTE: no terminal-bash row and no tool-terminal row on purpose.
    #
    # terminal-bash would race the bridge: dshell's bridge registers its raw PTY
    # backend under the type `shell` — the name dsh's persistent shell tools
    # resolve by default (`backendType` defaults to `'shell'`) — so any
    # composition whose persistent shell group does NOT isolate the terminals
    # realm resolves the bridge's backend and its bash lands on the agent's
    # watched terminal. Two backends for that name fail loud at boot
    # (DUPLICATE_BACKEND).
    #
    # tool-terminal supplies dsh's six model-facing `terminal_*` tools, and no
    # dshell code uses it: the agent's view of its own shell is dshell-commands'
    # three tools, and dsh's web surface deliberately leaves agent-plane tool
    # rows out of the host plane for presets to mount. Naming it here would put
    # those tools in front of every session, stock ones included.
    #
    # Only opted-in sessions ever open the PTY this service carries: the browser
    # half asks for the stream only while the session carries the terminal-mode
    # flag.

    # Browser half of the `terminal` Conversation target.
    - id: dshell-conversation
      name: 'dsh-noemaloom/native/dshell-conversation'

    # Browser↔host PTY wire bridge.
    - id: dshell-terminal-bridge
      name: 'dsh-noemaloom/native/dshell-terminal-bridge'

    # The per-session terminal-mode flag, its blank-session switch, and the
    # integrated terminal view (an additive `conversation.view` entry that
    # exists only for opted-in sessions).
    - id: dshell-mode
      name: 'dsh-noemaloom/native/dshell-mode'

    # /new on ctx.commands, plus the agent-terminal model tools
    # (dshell_get_agent_terminal, dshell_terminal_read, dshell_terminal_output).
    - id: dshell-commands
      name: 'dsh-noemaloom/native/dshell-commands'

    # SSH devices: durable device/key registry, per-session assignment through
    # the stock session row's hover strip, and routing of a bound session's
    # shell commands to that device.
    - id: dshell-ssh
      name: 'dsh-noemaloom/native/dshell-ssh'

    # Cross-session pipe: user-established links between sessions, deferred
    # requests one agent hands to another, scoped revocable folder grants, and
    # the watchdog that guarantees the requester is always woken.
    - id: dshell-buffer
      name: 'dsh-noemaloom/native/dshell-buffer'

    # Right-sidebar file navigator: takes over the `files` tab kind (dsh's
    # registry keeps one builtin and one extension per kind, and the extension
    # is the one in force) — but only while the current session opted in, so a
    # stock session keeps the shipped pane.
    - id: dshell-files
      name: 'dsh-noemaloom/native/dshell-files'

    # Token usage: a durable per-model index over every session's reported
    # usage, and the settings page that charts it. Host half only — the page
    # joins the client roster through the same package's `./client` face, which
    # the client bundle loader picks up from this row like every other dshell
    # plugin's.
    - id: dshell-usage
      name: 'dsh-noemaloom/native/dshell-usage'

# ── the one stock row dshell must own ──────────────────────────────────
# `ctx.fs` has exactly one provider, and a session bound to an SSH device needs
# its file operations — read, write, edit, list — to run on that device instead
# of this machine, so dshell-ssh's provider takes the stock backend's place
# (extending it; the local half of every call is the stock implementation
# verbatim, see packages/dshell/ssh/src/fs-routing.ts). Two providers for one
# service name is a cordis error, hence the disable. This is host-side and
# invisible: a stock session's file tools still resolve to the stock code path.
- id: fs-sandbox
  disabled: true

# ── default agent preset ───────────────────────────────────────────────
# No override and no dshell preset. The stock presets own their shell stacks
# behind deliberate isolation (tool-bash via the single-provider `ctx.shell`,
# persistent-bash inside an `isolate: terminals` realm), so no plugin can — or
# should — rewire them. New sessions follow dsh's default (standard); the
# terminal-mode flag is orthogonal to the preset the reader picks.

# ── dev-only hot reload (skip in non-dev sessions) ─────────────────────
# dsh's web profile mounts @deepseek-ai/dsh-client-hmr as a client
# roster row that stays idle until a `pnpm run dev:web` rebuild watcher
# rewrites client bundles. The row stays in the roster even when no
# watcher runs, which makes the client bundle loader look up `/plugins/
# ...dsh-client-hmr/client.js` at boot; without a rebuild watcher the
# file may not exist, blocking the entire client bundle. Disabling the
# row by re-asserting it with `disabled: true` removes it from the
# client roster without touching dsh source.
- id: client-hmr
  disabled: true

- insert:
    - id: agent-procedures
      name: 'dsh-noemaloom/native/agent-procedures'

- insert:
    - id: motion-ui
      name: 'dsh-noemaloom/original/motion-ui'

# 将 dsh-cross-session-approval bundle 挂载到 DSH 0.2.x profile 的宿主组合。
# name 为包名，id 为组合条目标识，对应插件导出的运行时名称。
# 必需服务通过 Cordis inject 声明；缺少任一必需服务会使插件等待加载。
#
# sandboxPolicy / permissionPresets / approval / sessions 在运行时通过
# ctx.get() 可选获取，不列入 inject。缺失时告警、停用审批桥，并拒绝
# 启用的 A/F 对应创建路径；其余工具仍可使用。具体边界见 README。
- insert:
    - id: cross-session-approval
      name: 'dsh-noemaloom/original/cross-session-approval'
      inject:
        - tools
        - nexusCrossSessionMailbox
        - agents
        - sessionPersistence
        - agentDefaultModel
        - agentPresets
        - workspaceRegistry
        - sessionQuery
        - sessionTitle
      config:
        # 派活登记保存在 <工作区>/<stateDir>/registry.json。
        stateDir: .cross-session
        # A：发布前三维权限夹紧。
        # cap：缺省权限取调用者与部署默认中较严者，工作区按调用者边界校验；失败即拒绝。
        # 显式 permission 可与调用者同档；最高档调用者不受工作区包含限制。
        # off：关闭 A，恢复宿主默认创建行为；启用审批桥必须为 cap。
        spawnPermission: cap
        # F：派生入口（fork / 恢复）权限夹紧。
        # cap：活跃源按源当前策略限制；未加载源按部署默认上限，越界或解析失败则拒绝。
        # strict：活跃源同 cap，未加载源直接拒绝；恢复派生会话也可能失败。
        # off：关闭 F，不影响 A。
        forkPermission: cap
        # 跨会话审批桥：将受支持的提权请求交给活跃的创建者会话。
        approvalBridge:
          enabled: true
          timeoutMs: 300000        # 从处理入口起算的总截止时间，单位为毫秒
          maxActiveRequests: 64    # 活动请求上限，入口即计数；超限委托本地 UI
          maxPending: 64           # 已登记待决请求上限；超限在登记前委托本地 UI
          noticeTextBytes: 32768   # 桥通知文本的字节配额
          showObservedArgs: advisory  # advisory | off：是否附入口观察值，仅供参考
          injectWithdraw: true     # 超时、卸载、取消或委托时向活跃创建者注入撤单通知

# Insert this plugin as its own row in the desktop profile's loader tree.
#
# The row name must match package.json's "name"; the package itself has to be a
# dependency of the profile (and listed in its dsh.profile.bundles) for this file
# to be read at all.
#
# 本 bundle 承载核心的三件事（原先分属三个插件包，现已合并到 @local/dsh-computer-use）：
#   * 电脑操作 —— `computer_*` 系列工具，仍由会话开关「电脑操作」控制；
#   * token-guard —— 把过长的工具返回压成结构化摘要（原 @local/dsh-token-guard），
#     由下面的 config.tokenGuard 控制；
#   * app-launch —— 用干净环境启动 GUI 应用（原 @local/dsh-app-launch），
#     由下面的 config.appLaunch 控制。
#
# 三个任务预设（task-desktop / task-analysis / task-document）自 1.40.0 起拆到
# presets/cordis.patch.yml，需要时把插件根下的 presets/ 作为独立 bundle 安装。
# 核心安装不再读取文档/分析运行时路径，预设坏了也不会遮蔽电脑操作本身。
- insert:
    - id: computer-use
      name: 'dsh-noemaloom/original/computer-use'
      config:
        # Computer control stays off until the user flips the 电脑操作 chip, per
        # Session. Set this to true only on a machine where every Session is
        # allowed to drive the mouse and keyboard without asking.
        defaultEnabled: false

        # ── 原 @local/dsh-token-guard 的配置（键名不变，便于与历史指标对照） ──
        tokenGuard:
          enabled: true
          # 只压这两类结果：shell 输出。桌面/图像结果刻意不动（见 docs/01 §3.5）。
          tools:
            - pwsh
          # 普通成功输出预算（6.txt 三-2：约 300–800 token）
          normalMaxTokens: 800
          # 排障输出预算（6.txt 三-2：优先控制在 2,000 token 内）
          troubleshootingMaxTokens: 2000
          # 带图的返回保持原样，避免干扰图像缓存实验
          skipImageResults: true
          # 完整输出必须可追溯：优先写 spill，缺失时写本地文件
          keepFullOutput: true
          fullOutputDir: ''
          # 每次压缩追加一行指标，供配对测试读取
          metrics: true
          metricsPath: ''

        # ── 原 @local/dsh-app-launch 的配置（键名不变） ──
        appLaunch:
          enabled: true
          # 等窗口出现多久才回话（毫秒）
          defaultWaitMs: 6000
          # 启动后不把应用挂在会话下
          detach: true
