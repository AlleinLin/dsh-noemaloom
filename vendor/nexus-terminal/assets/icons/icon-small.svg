<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!--
    dshell's icon at launcher sizes (16 and 32 px), where the spark of
    `icon.svg` turns to mud. Same tile and same gradient; the prompt is drawn
    larger and thicker to hold the extra pixels, and moves to the optical centre
    the spark was balancing.
  -->
  <defs>
    <linearGradient id="tile" x1="96" y1="16" x2="416" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#2E4CC0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <path d="M110 160 L256 256 L110 352" stroke="#fff" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="310" y="316" width="128" height="72" rx="36" fill="#fff"/>
</svg>
