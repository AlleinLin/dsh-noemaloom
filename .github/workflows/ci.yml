name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Report check failure details
        if: failure()
        run: node scripts/report-ci-failure.mjs
      - name: Upload check failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-failure-evidence
          path: evidence/tests.*
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run pack:delivery
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-package
          path: build/
          if-no-files-found: error
