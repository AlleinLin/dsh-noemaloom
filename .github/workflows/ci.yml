name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=1024 --max-semi-space-size=8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run audit:security
      - run: npm run check
      - name: Verify the upgraded cognition source and changed upstream regressions
        run: node tools/acceptance/cognition-upstream.mjs --output evidence/cognition
      - name: Report check failure details
        if: failure()
        run: node scripts/report-ci-failure.mjs
      - name: Upload check failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-failure-evidence
          path: |
            evidence/tests.*
            evidence/cognition/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run pack:delivery
      - name: Install the exact rc.3 Forge companion SDK
        working-directory: companions/forge-tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit the Forge companion dependency graph
        working-directory: companions/forge-tools
        run: npm audit --audit-level=low
      - name: Build and test the original Forge companion
        working-directory: companions/forge-tools
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-package
          path: build/
          if-no-files-found: error
