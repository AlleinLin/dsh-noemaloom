- id: preset-suite-windows-coding
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: suite.windows-coding
    name: Windows 编码
    description: PowerShell 7 持久终端与精确文本编辑；其余能力按需发现。
    order: 10
    plugins:
      - id: nexus-preset-policy
        name: '@local/dsh-nexus/preset-runtime'
        config:
          presetId: suite.windows-coding
          shellId: pwsh7
          registerShell: false
      - id: agent-instructions
        name: '@local/dsh-nexus/project-rules'
        config:
          maxBytes: 65536
          instructionFileCandidates: [DEEPSEEK.md, AGENT.md, AGENTS.md, CLAUDE.md]
          localInstructionFileCandidates: []
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: precise-editor
        name: '@deepseek-ai/dsh-tool-str-replace-editor'
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: 你是协助用户完成软件工作的工程助手。遵守当前任务、工作区规范及宿主权限，先核实事实，再完成实现与验证。
          complete: true
          includeRuntimeContext: false
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          read: false
          readImage: true
          write: false
          edit: false
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
        config:
          - id: compaction-basic
            name: '@local/dsh-nexus/compaction'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
      - id: persistent-shell
        name: cordis:group
        group: true
        isolate:
          terminals: true
        config:
          - id: pty
            name: '@deepseek-ai/dsh-terminal'
          - id: terminal-pwsh
            name: '@deepseek-ai/dsh-terminal-bash'
            disabled: !!js process.platform !== 'win32'
            config:
              shellDialect: pwsh
              timeoutMs: 300000
          - id: persistent-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh-persistent'
            disabled: !!js process.platform !== 'win32'
            config:
              timeoutMs: 300000
              description: 在 PowerShell 7 持久终端执行命令。正常调用之间保留工作目录、变量、函数与环境；权限或预设代际变更后重建，不自动重跑。
